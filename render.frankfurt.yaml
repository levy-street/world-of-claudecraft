# Fresh European deployment. This file is intentionally separate from
# render.yaml so creating the Frankfurt service cannot rename or tear down the
# existing Oregon Blueprint before the replacement passes its smoke tests.
services:
  - type: web
    name: woc-game-eu
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/lionfart/world-of-claudecraft
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /livez
    buildCommand: >-
      npm install --global pnpm@10.34.5 &&
      pnpm install --frozen-lockfile &&
      export NODE_OPTIONS=--max-old-space-size=1536 &&
      pnpm run build &&
      pnpm run build:server &&
      pnpm run build:bot
    startCommand: node dist-server/server.cjs
    envVars:
      - key: DATABASE_URL
        # Reuse the proven Neon credential without exposing it in this repo or
        # copying it through the browser. The Oregon service remains available
        # until the Frankfurt smoke test passes.
        fromService:
          type: web
          name: woc-game
          envVarKey: DATABASE_URL
      - key: PUBLIC_ORIGIN
        # Render may add a suffix when the desired global subdomain is already
        # taken. Self-reference its authoritative URL instead of guessing it.
        fromService:
          type: web
          name: woc-game-eu
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "26"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DB_POOL_MAX_CLIENTS
        value: "5"
      - key: REALM_NAME
        value: Claudemoon
      - key: PLAYER_DIRECTIONAL_COMBAT
        value: "1"
      # Built-in points/test economy. SOL transfers are constructed only after
      # the server verifies this RPC's Devnet genesis hash. The treasury below
      # is public Devnet data, never key material.
      - key: WOC_TEST_ECONOMY
        value: "1"
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: WOC_TEST_TREASURY
        # Public Devnet treasury recovered from the old marketplace dry-run
        # roster (docs/woc-marketplace-hardening/devnet.md). No private key is
        # stored in the repository or Render configuration.
        value: 9fzukogxcT5c113MA7gNSeP1UMsc3eH27BXbBihWaUqf
      # Keep the free 512 MB / fractional-CPU realm inside its measured target.
      - key: MAX_PLAYERS_PER_REALM
        value: "25"
