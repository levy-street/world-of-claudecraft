[package]
name = "woc-spin-vault"
version = "0.1.0"
description = "SOL prize-vault custody + capped, replay-guarded payout for the daily holder spinner"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "woc_spin_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
