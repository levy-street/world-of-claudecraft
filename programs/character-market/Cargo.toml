[package]
name = "character-market"
version = "0.1.0"
description = "Escrow + 70/30 USDC settlement for tradeable World of ClaudeCraft characters"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "character_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

# Size-optimized release: shrinks the deployed .so (lower devnet rent) while
# keeping the overflow checks Anchor requires for safe arithmetic.
[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
