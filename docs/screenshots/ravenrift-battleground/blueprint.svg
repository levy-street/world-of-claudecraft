stroke="#ffd24a" stroke-width="2"/><circle cx="497" cy="662" r="3" fill="#ffd24a"/><text x="575" y="44" font-size="26" fill="#3a3020" text-anchor="middle" font-weight="600" font-family="Georgia, serif">RAVENRIFT: THE FIELD</text><text x="575" y="74" font-size="14" fill="#6b5b45" text-anchor="middle" font-weight="600" font-family="Georgia, serif">100 x 280 yards, walled and open-air. North is up.</text><text x="575" y="206" font-size="16" fill="#3a78d1" text-anchor="middle" font-weight="600" font-family="Georgia, serif">AZURE KEEP</text><text x="575" y="1706" font-size="16" fill="#d1413a" text-anchor="middle" font-weight="600" font-family="Georgia, serif">CRIMSON KEEP</text><text x="575" y="494" font-size="18" fill="#3a78d1" text-anchor="middle" font-weight="700" font-family="Georgia, serif">AZURE FIELD</text><text x="575" y="1418" font-size="18" fill="#d1413a" text-anchor="middle" font-weight="700" font-family="Georgia, serif">CRIMSON FIELD</text><text x="575" y="734" font-size="18" fill="#5e7a3a" text-anchor="middle" font-weight="700" font-family="Georgia, serif">THE RUIN COURTYARD</text><line x1="587" y1="242" x2="899" y2="266" stroke="#3a78d1" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="276.79999999999995" font-size="14" fill="#3a78d1" text-anchor="start" font-weight="600" font-family="Georgia, serif">flag stand + capture point</text><line x1="596" y1="218" x2="899" y2="218" stroke="#3a78d1" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="228.79999999999998" font-size="14" fill="#3a78d1" text-anchor="start" font-weight="600" font-family="Georgia, serif">spawn ring (wave respawn)</text><line x1="575" y1="404" x2="899" y2="416" stroke="#8a6a3c" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="426.79999999999995" font-size="14" fill="#8a6a3c" text-anchor="start" font-weight="600" font-family="Georgia, serif">flag-approach rune</text><line x1="803" y1="950" x2="899" y2="968" stroke="#8a6a3c" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="978.8000000000001" font-size="14" fill="#8a6a3c" text-anchor="start" font-weight="600" font-family="Georgia, serif">flank rune + cover</text><line x1="347" y1="950" x2="251" y2="932" stroke="#8a6a3c" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="924.8000000000001" font-size="14" fill="#8a6a3c" text-anchor="end" font-weight="600" font-family="Georgia, serif">flank rune + cover</text><line x1="623" y1="926" x2="899" y2="890" stroke="#6b5b45" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="882.8000000000001" font-size="14" fill="#6b5b45" text-anchor="start" font-weight="600" font-family="Georgia, serif">heart ruin 16x16 (hollow)</text><line x1="671" y1="818" x2="899" y2="782" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="774.8" font-size="14" fill="#3a3020" text-anchor="start" font-weight="600" font-family="Georgia, serif">sightline breakers (two pairs)</text><line x1="653" y1="1286" x2="899" y2="1310" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="1320.8000000000002" font-size="14" fill="#3a3020" text-anchor="start" font-weight="600" font-family="Georgia, serif">main gate (10yd)</text><line x1="419" y1="1286" x2="251" y2="1250" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1242.8000000000002" font-size="14" fill="#3a3020" text-anchor="end" font-weight="600" font-family="Georgia, serif">gatehouse (offset doors)</text><line x1="419" y1="1298" x2="251" y2="1322" stroke="#8a6a3c" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1332.8000000000002" font-size="14" fill="#8a6a3c" text-anchor="end" font-weight="600" font-family="Georgia, serif">ambush crates</text><line x1="395" y1="1538" x2="251" y2="1526" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1518.8000000000002" font-size="14" fill="#3a3020" text-anchor="end" font-weight="600" font-family="Georgia, serif">wing baffle</text><line x1="635" y1="1454" x2="899" y2="1442" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="899" y="1434.8000000000002" font-size="14" fill="#3a3020" text-anchor="start" font-weight="600" font-family="Georgia, serif">staggered S-approach walls</text><line x1="557" y1="1586" x2="251" y2="1598" stroke="#7d6a52" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1608.8000000000002" font-size="14" fill="#7d6a52" text-anchor="end" font-weight="600" font-family="Georgia, serif">mouth barricade (low wall)</text><line x1="521" y1="1718" x2="251" y2="1742" stroke="#d1413a" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1752.8000000000002" font-size="14" fill="#d1413a" text-anchor="end" font-weight="600" font-family="Georgia, serif">keep banner poles</text><line x1="575" y1="962" x2="251" y2="1130" stroke="#3a78d1" stroke-width="1.4" stroke-dasharray="4 3"/><text x="251" y="1140.8000000000002" font-size="14" fill="#3a78d1" text-anchor="end" font-weight="600" font-family="Georgia, serif">view-distance ring: ~120yd of</text><text x="251" y="1157" font-size="14" fill="#3a78d1" text-anchor="end" font-weight="600" font-family="Georgia, serif">fog; enemies fade in</text><text x="575" y="1844" font-size="13.5" fill="#6b5b45" text-anchor="middle" font-weight="600" font-family="Georgia, serif">Every move between chambers passes a crossing: the main gate or the gatehouse jog.</text><text x="575" y="1868" font-size="13.5" fill="#6b5b45" text-anchor="middle" font-weight="600" font-family="Georgia, serif">The whole map is point-symmetric, so neither side is favored. The sim tracks the whole match;</text><text x="575" y="1892" font-size="13.5" fill="#6b5b45" text-anchor="middle" font-weight="600" font-family="Georgia, serif">the client sees to ~120yd with distance fog, like the open world.</text><rect x="1104" y="104" width="280" height="422" fill="#fff" opacity="0.55" rx="10"/><text x="1118" y="128" font-size="18" font-weight="700" fill="#3a3020" font-family="Georgia, serif">Legend</text><rect x="1120" y="151" width="18" height="14" fill="#2c3444" rx="2"/><text x="1146" y="163" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">wall (blocks movement + sight)</text><rect x="1120" y="181" width="18" height="14" fill="#6b5b45" rx="2"/><text x="1146" y="193" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">heart ruin (solid block, hollow shell)</text><rect x="1120" y="214" width="18" height="8" fill="#7d6a52" rx="2"/><text x="1146" y="223" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">low barricade (blocks movement)</text><circle cx="1129" cy="248" r="7" fill="#2c3444"/><text x="1146" y="253" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">pillar</text><rect x="1122" y="271" width="14" height="14" fill="#8a6a3c" rx="2"/><text x="1146" y="283" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">crate stack</text><circle cx="1129" cy="308" r="8" fill="#d1413a" stroke="#3a3020" stroke-width="2"/><text x="1146" y="313" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">flag stand (Crimson / Azure)</text><circle cx="1129" cy="338" r="4" fill="#3a78d1"/><text x="1146" y="343" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">spawn point (5 per keep)</text><path d="M 1123 360 l 6 14 h -12 z" fill="#3a78d1" opacity="0.85"/><text x="1146" y="373" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">keep banner pole</text><g><circle cx="1129" cy="398" r="8" fill="none" stroke="#ffd24a" stroke-width="2"/><circle cx="1129" cy="398" r="3.5" fill="#ffd24a"/></g><text x="1146" y="403" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">speed rune (1.4x for 8s, 22s recharge)</text><rect x="1120" y="421" width="18" height="14" fill="#d1413a" opacity="0.2" rx="2"/><text x="1146" y="433" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">keep grounds (garrison theme)</text><rect x="1120" y="451" width="18" height="14" fill="#5e7a3a" opacity="0.25" rx="2"/><text x="1146" y="463" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">ruin courtyard (overgrown theme)</text><line x1="1120" y1="488" x2="1138" y2="488" stroke="#3a3020" stroke-width="1.4" stroke-dasharray="4 3"/><text x="1146" y="493" font-size="14.5" fill="#3a3020" font-family="Georgia, serif">annotation</text></svg>