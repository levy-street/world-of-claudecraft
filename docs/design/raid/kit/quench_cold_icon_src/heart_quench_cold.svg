<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Quenching Cold</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="0.55" stop-color="#1c6fd1"/>
      <stop offset="1" stop-color="#0a2a66"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#bfe6ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="arm" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-196"/>
      <polyline points="-46,-92 0,-62 46,-92"/>
      <polyline points="-42,-150 0,-122 42,-150"/>
      <polyline points="-20,-186 0,-170 20,-186"/>
    </g>
    <g id="flake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <g transform="translate(256 256)">
    <g stroke="#9fd8ff" stroke-width="40" filter="url(#soft)" opacity="0.9"><use href="#flake"/></g>
    <g stroke="#0b3a80" stroke-width="30" opacity="0.55" transform="translate(4 6)"><use href="#flake"/></g>
    <g stroke="#ffffff" stroke-width="24"><use href="#flake"/></g>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#ffffff"/>
  </g>
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#06183d" stroke-width="12" opacity="0.7"/>
</svg>
