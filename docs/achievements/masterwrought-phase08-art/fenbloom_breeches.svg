  <circle cx="168" cy="366" r="7" fill="url(#tieG)" stroke="#241f12" stroke-width="2.5"/>
  <path d="M166 372 q-9 14 -5 28" stroke="url(#tieG)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M172 372 q3 16 10 26" stroke="#5f4f31" stroke-width="5" fill="none" stroke-linecap="round"/>
