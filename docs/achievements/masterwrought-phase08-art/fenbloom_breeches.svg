<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Fenbloom Breeches</title>
<defs>
<radialGradient id="bg" cx="0.36" cy="0.3" r="1.05">
<stop offset="0" stop-color="#333a2c"/>
<stop offset="0.55" stop-color="#181b14"/>
<stop offset="1" stop-color="#0f100e"/>
</radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="10"/>
</filter>
<filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<linearGradient id="leatherL" x1="0" y1="0" x2="0.7" y2="1">
<stop offset="0" stop-color="#93a468"/>
<stop offset="0.5" stop-color="#5f7042"/>
<stop offset="1" stop-color="#39452a"/>
</linearGradient>
<linearGradient id="leatherR" x1="0" y1="0" x2="0.7" y2="1">
<stop offset="0" stop-color="#6f8054"/>
<stop offset="0.5" stop-color="#485739"/>
<stop offset="1" stop-color="#273023"/>
</linearGradient>
<linearGradient id="waistG" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0" stop-color="#9aab72"/>
<stop offset="0.55" stop-color="#67764a"/>
<stop offset="1" stop-color="#3e4a2e"/>
</linearGradient>
<linearGradient id="tieG" x1="0" y1="0" x2="0.6" y2="1">
