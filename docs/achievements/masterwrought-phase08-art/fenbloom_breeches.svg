  <path d="M286 394 q28 12 56 -1" stroke="#10150c" stroke-width="4" fill="none" opacity="0.55"/>
  <path d="M346 344 l-5 50" stroke="#6f7f88" stroke-width="3.5" fill="none" opacity="0.28" stroke-linecap="round"/>
