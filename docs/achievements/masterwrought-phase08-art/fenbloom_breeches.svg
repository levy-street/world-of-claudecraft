  <path d="M274 352 q40 -12 80 -2" stroke="url(#tieG)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M276 364 q38 12 76 2" stroke="url(#tieG)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M278 384 q36 -12 70 0" stroke="url(#tieG)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M276 348 q40 -12 78 -2" stroke="#cbb787" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M278 370 q36 10 72 1" stroke="#1e1a0f" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <circle cx="344" cy="368" r="7" fill="url(#tieG)" stroke="#1e1a0f" stroke-width="2.5"/>
  <path d="M346 374 q8 14 4 28" stroke="#564628" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M340 374 q-4 16 -10 26" stroke="#4a3c23" stroke-width="5" fill="none" stroke-linecap="round"/>
