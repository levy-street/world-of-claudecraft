</radialGradient>
<radialGradient id="brewGlow" cx="0.5" cy="0.5" r="0.7">
<stop offset="0" stop-color="#d7b6ff" stop-opacity="0.7"/>
<stop offset="0.5" stop-color="#8a45e0" stop-opacity="0.35"/>
<stop offset="1" stop-color="#5a1fb0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
