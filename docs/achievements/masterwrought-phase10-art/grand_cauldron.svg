<ellipse cx="256" cy="264" rx="140" ry="40" fill="url(#iron)" stroke="#0b0c10" stroke-width="7"/>
<ellipse cx="256" cy="260" rx="118" ry="30" fill="#0f1014" stroke="#0b0c10" stroke-width="4"/>
