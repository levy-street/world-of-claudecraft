<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Grand Cauldron</title>
<defs>
<radialGradient id="bg" cx="0.36" cy="0.3" r="1.05">
<stop offset="0" stop-color="#2c2536"/>
<stop offset="0.55" stop-color="#191621"/>
<stop offset="1" stop-color="#101014"/>
</radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="10"/>
</filter>
<filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<linearGradient id="iron" x1="0" y1="0" x2="0.55" y2="1">
<stop offset="0" stop-color="#aeb5c4"/>
<stop offset="0.35" stop-color="#7c8494"/>
<stop offset="0.75" stop-color="#474d5a"/>
<stop offset="1" stop-color="#262a33"/>
</linearGradient>
<linearGradient id="ironDeep" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#6c7280"/>
<stop offset="0.55" stop-color="#3a3e49"/>
<stop offset="1" stop-color="#171920"/>
</linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#f4dc90"/>
<stop offset="0.55" stop-color="#bb903e"/>
<stop offset="1" stop-color="#6a4d18"/>
</linearGradient>
<radialGradient id="brew" cx="0.42" cy="0.34" r="0.85">
<stop offset="0" stop-color="#efe0ff"/>
<stop offset="0.45" stop-color="#a06ae8"/>
