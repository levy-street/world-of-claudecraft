<path d="M388 270 q30 34 -6 60" fill="none" stroke="#0b0c10" stroke-width="14" stroke-linecap="round"/>
<path d="M388 270 q30 34 -6 60" fill="none" stroke="url(#brass)" stroke-width="8" stroke-linecap="round"/>
