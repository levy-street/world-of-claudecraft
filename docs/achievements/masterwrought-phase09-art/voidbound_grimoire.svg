<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Voidbound Grimoire</title>
<defs>
<radialGradient id="bg" cx="0.36" cy="0.3" r="1.05">
<stop offset="0" stop-color="#2c2836"/>
<stop offset="0.55" stop-color="#191621"/>
<stop offset="1" stop-color="#101014"/>
</radialGradient>
<radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="10"/>
</filter>
<filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="4"/>
</filter>
<linearGradient id="coverG" x1="0" y1="0" x2="0.7" y2="1">
<stop offset="0" stop-color="#2e2a3c"/>
<stop offset="0.5" stop-color="#1b1826"/>
<stop offset="1" stop-color="#0c0a12"/>
</linearGradient>
<linearGradient id="spineG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#241f31"/>
<stop offset="1" stop-color="#100d18"/>
</linearGradient>
<linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#cdbfa4"/>
<stop offset="0.5" stop-color="#a08e70"/>
<stop offset="1" stop-color="#5e5040"/>
</linearGradient>
<linearGradient id="voidMetal" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#8f86b8"/>
<stop offset="0.55" stop-color="#4c4370"/>
<stop offset="1" stop-color="#231d3a"/>
</linearGradient>
<radialGradient id="sigilCore" cx="0.5" cy="0.5" r="0.7">
<stop offset="0" stop-color="#e4d5ff"/>
<stop offset="0.4" stop-color="#9c5cf0"/>
<stop offset="1" stop-color="#3b1670"/>
</radialGradient>
<radialGradient id="voidGlow" cx="0.5" cy="0.5" r="0.7">
<stop offset="0" stop-color="#9c5cf0" stop-opacity="0.5"/>
<stop offset="1" stop-color="#6a30c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<!-- faint violet atmosphere behind the key side -->
<ellipse cx="182" cy="162" rx="185" ry="150" fill="#4c3a70" opacity="0.16" filter="url(#soft)"/>
<!-- grounded contact shadow -->
<ellipse cx="256" cy="428" rx="160" ry="27" fill="#000000" opacity="0.55" filter="url(#soft)"/>
<ellipse cx="256" cy="424" rx="108" ry="16" fill="#000000" opacity="0.4" filter="url(#soft4)"/>
<!-- page block, slightly fanned -->
<path d="M 150 118 C 236 104 296 104 372 116 L 386 380 C 302 368 240 368 166 382 Z" fill="url(#pageG)" stroke="#3a3226" stroke-width="4"/>
<g fill="none" stroke="#6e5f4a" stroke-width="2" opacity="0.6">
  <path d="M 158 130 C 240 116 296 116 366 127"/>
  <path d="M 162 360 C 242 348 300 348 378 358"/>
  <path d="M 380 150 L 384 350"/>
</g>
<!-- black leather cover, three-quarter view -->
<path d="M 132 108 C 128 96 136 88 150 88 L 348 76 C 366 74 378 84 380 100 L 396 372 C 398 388 388 398 372 398 L 176 412 C 160 414 148 406 146 392 Z" fill="url(#coverG)" stroke="#060509" stroke-width="5"/>
<!-- raised spine on the left -->
<path d="M 132 108 C 128 96 136 88 150 88 L 172 87 C 160 90 154 98 156 110 L 172 396 C 173 404 170 410 162 411 C 152 410 147 402 146 392 Z" fill="url(#spineG)" stroke="#060509" stroke-width="4"/>
<g fill="none" stroke="#060509" stroke-width="3.5">
  <path d="M 154 150 C 160 148 166 148 172 150"/>
  <path d="M 160 250 C 166 248 172 248 178 250"/>
  <path d="M 166 348 C 172 346 178 346 184 348"/>
</g>
<g fill="none" stroke="#544a72" stroke-width="2" opacity="0.6">
  <path d="M 154 146 C 160 144 166 144 172 146"/>
  <path d="M 160 246 C 166 244 172 244 178 246"/>
  <path d="M 166 344 C 172 342 178 342 184 344"/>
</g>
<!-- leather grain and cool key light on the cover -->
<ellipse cx="230" cy="160" rx="110" ry="70" fill="#8f86b8" opacity="0.14" filter="url(#soft)"/>
<ellipse cx="356" cy="360" rx="120" ry="90" fill="#020208" opacity="0.5" filter="url(#soft)"/>
<path d="M 182 96 L 344 86" fill="none" stroke="#7d74a4" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
<!-- void-metal corner caps -->
<g fill="url(#voidMetal)" stroke="#0a0714" stroke-width="3.5">
  <path d="M 348 76 C 362 75 376 84 379 98 L 380 116 L 344 108 L 340 78 Z"/>
  <path d="M 390 340 L 396 372 C 397 386 388 397 374 398 L 356 399 L 358 356 Z"/>
  <path d="M 150 88 L 184 86 L 186 116 L 140 122 L 134 106 C 132 96 140 89 150 88 Z"/>
  <path d="M 158 380 L 196 376 L 198 408 L 176 412 C 164 413 156 406 155 396 Z"/>
</g>
<g fill="none" stroke="#b3aad6" stroke-width="2" opacity="0.6">
  <path d="M 354 82 C 364 82 372 88 375 97"/>
  <path d="M 156 92 L 180 90"/>
</g>
<!-- void sigil: rune ring with an event-horizon core -->
<circle cx="268" cy="242" r="102" fill="url(#voidGlow)" filter="url(#soft4)"/>
<g transform="rotate(-8 268 242)">
  <circle cx="268" cy="242" r="74" fill="none" stroke="#0a0714" stroke-width="12" opacity="0.8"/>
  <circle cx="268" cy="242" r="74" fill="none" stroke="url(#voidMetal)" stroke-width="8"/>
  <path d="M 214 192 A 72 72 0 0 1 262 168" fill="none" stroke="#cfc2f2" stroke-width="3" opacity="0.7"/>
  <!-- orbiting rune ticks -->
  <g stroke="#9c5cf0" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M 268 158 l 0 -14"/>
    <path d="M 342 216 l 13 -5"/>
    <path d="M 330 306 l 10 9"/>
    <path d="M 268 326 l 0 14"/>
    <path d="M 196 296 l -11 8"/>
    <path d="M 190 200 l -12 -7"/>
  </g>
  <!-- inward-spiraling void arms -->
  <g fill="none" stroke="url(#sigilCore)" stroke-width="6" stroke-linecap="round">
    <path d="M 268 186 C 300 190 314 214 306 240 C 300 260 280 268 264 260"/>
    <path d="M 322 250 C 316 282 290 296 264 288 C 246 282 238 264 246 250"/>
    <path d="M 240 296 C 212 282 206 252 222 230 C 234 216 254 214 264 226"/>
  </g>
  <!-- event-horizon core -->
  <circle cx="268" cy="242" r="26" fill="#060312" stroke="#0a0714" stroke-width="3"/>
  <circle cx="268" cy="242" r="26" fill="none" stroke="#c9b2f8" stroke-width="2.5" opacity="0.9"/>
  <circle cx="268" cy="242" r="15" fill="url(#sigilCore)" opacity="0.35"/>
  <circle cx="261" cy="234" r="4" fill="#efe6ff" opacity="0.9"/>
</g>
<!-- void wisps curling off the sigil -->
<g fill="none" stroke="#9c5cf0" stroke-width="3" stroke-linecap="round" opacity="0.5">
  <path d="M 336 168 C 352 152 356 136 348 120"/>
  <path d="M 196 316 C 180 330 174 348 182 366"/>
</g>
<circle cx="350" cy="114" r="3" fill="#c9b2f8" opacity="0.7"/>
<circle cx="180" cy="372" r="2.5" fill="#9c5cf0" opacity="0.6"/>
<!-- void-metal clasp reaching from the fore-edge -->
<path d="M 384 220 L 414 218 C 422 218 426 224 424 232 L 420 260 C 418 268 412 272 404 270 L 386 264" fill="url(#voidMetal)" stroke="#0a0714" stroke-width="4"/>
<circle cx="404" cy="242" r="8" fill="#060312" stroke="#0a0714" stroke-width="2.5"/>
<circle cx="404" cy="242" r="8" fill="none" stroke="#9c5cf0" stroke-width="2" opacity="0.8"/>
<path d="M 390 224 L 410 222" stroke="#b3aad6" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
<rect width="512" height="512" fill="url(#vig)"/>
</svg>
