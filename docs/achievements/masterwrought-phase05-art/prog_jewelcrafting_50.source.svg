<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Facet and Filigree deed crest source (jewelcrafting 50-skill milestone)</title>
  <defs>
    <radialGradient id="fieldGrad" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#1d3370"/>
      <stop offset="0.45" stop-color="#122252"/>
      <stop offset="0.8" stop-color="#081231"/>
      <stop offset="1" stop-color="#04081c"/>
    </radialGradient>
    <radialGradient id="gemGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e8a94c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e8a94c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d078"/>
      <stop offset="0.35" stop-color="#c9962e"/>
      <stop offset="0.7" stop-color="#8a5a1a"/>
      <stop offset="1" stop-color="#5c3a10"/>
    </linearGradient>
    <linearGradient id="goldRimLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6d24"/>
      <stop offset="1" stop-color="#4a2e0c"/>
    </linearGradient>
    <linearGradient id="goldSpike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eecb70"/>
      <stop offset="0.5" stop-color="#b98a28"/>
      <stop offset="1" stop-color="#6e4614"/>
    </linearGradient>
    <linearGradient id="topazBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b44a"/>
      <stop offset="0.5" stop-color="#c07f1e"/>
      <stop offset="1" stop-color="#7a4c0e"/>
    </linearGradient>
  </defs>

  <!-- cardinal spikes -->
  <g stroke="#2a1a08" stroke-width="4" stroke-linejoin="round">
    <polygon points="256,48 274,96 256,122 238,96" fill="url(#goldSpike)"/>
    <polygon points="256,464 238,416 256,390 274,416" fill="url(#goldRimLow)"/>
    <polygon points="48,256 96,238 122,256 96,274" fill="url(#goldSpike)"/>
    <polygon points="464,256 416,274 390,256 416,238" fill="url(#goldSpike)"/>
  </g>

  <!-- medallion rim -->
  <circle cx="256" cy="256" r="198" fill="#241608"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldRim)" stroke-width="18"/>
  <circle cx="256" cy="256" r="201" fill="none" stroke="#1c1206" stroke-width="5"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3a2410" stroke-width="8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldRim)" stroke-width="6"/>

  <!-- rim studs at the diagonals -->
  <g fill="#e8c264" stroke="#4a2e0c" stroke-width="3">
    <circle cx="120.2" cy="120.2" r="9"/>
    <circle cx="391.8" cy="120.2" r="9"/>
    <circle cx="120.2" cy="391.8" r="9"/>
    <circle cx="391.8" cy="391.8" r="9"/>
  </g>

  <!-- inner field -->
  <circle cx="256" cy="256" r="168" fill="url(#fieldGrad)"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#d9b45c" stroke-opacity="0.22" stroke-width="3"/>

  <!-- glow behind the gem -->
  <ellipse cx="256" cy="238" rx="120" ry="106" fill="url(#gemGlow)"/>

  <!-- filigree scroll curls, left and right of the gem -->
  <g fill="none" stroke="url(#goldRim)" stroke-width="10" stroke-linecap="round">
    <path d="M 214 300 C 168 302 140 280 142 246 C 144 220 168 210 186 222 C 200 232 198 254 182 258"/>
    <path d="M 298 300 C 344 302 372 280 370 246 C 368 220 344 210 326 222 C 312 232 314 254 330 258"/>
  </g>
  <g fill="none" stroke="#5c3a10" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M 214 300 C 168 302 140 280 142 246"/>
    <path d="M 298 300 C 344 302 372 280 370 246"/>
  </g>
  <!-- curl tips -->
  <g fill="#e8c264" stroke="#4a2e0c" stroke-width="3">
    <circle cx="182" cy="258" r="7"/>
    <circle cx="330" cy="258" r="7"/>
  </g>
  <!-- filigree drop scrolls under the gem -->
  <g fill="none" stroke="url(#goldRim)" stroke-width="8" stroke-linecap="round">
    <path d="M 232 322 C 224 344 236 360 256 360 C 276 360 288 344 280 322"/>
  </g>

  <!-- faceted topaz, marquise cut, point up -->
  <g stroke="#3a2408" stroke-width="4" stroke-linejoin="round">
    <polygon fill="url(#topazBody)" points="256,132 300,180 312,238 288,296 256,318 224,296 200,238 212,180"/>
  </g>
  <g stroke="none">
    <!-- crown facets -->
    <polygon fill="#f0c465" points="256,132 300,180 272,196 256,184"/>
    <polygon fill="#b57d1e" points="300,180 312,238 284,232 272,196"/>
    <polygon fill="#8f5c12" points="312,238 288,296 268,262 284,232"/>
    <polygon fill="#a86e18" points="288,296 256,318 256,278 268,262"/>
    <polygon fill="#7c4c0c" points="256,318 224,296 244,262 256,278"/>
    <polygon fill="#c58b26" points="224,296 200,238 228,232 244,262"/>
    <polygon fill="#dfa93e" points="200,238 212,180 240,196 228,232"/>
    <polygon fill="#f7d685" points="212,180 256,132 256,184 240,196"/>
    <!-- table -->
    <polygon fill="#e3ac3c" points="256,184 272,196 284,232 268,262 256,278 244,262 228,232 240,196"/>
    <polygon fill="#ffe9ae" fill-opacity="0.85" points="256,184 272,196 246,248 236,214"/>
  </g>
  <!-- facet edge light -->
  <g fill="none" stroke="#ffe2a0" stroke-opacity="0.5" stroke-width="2">
    <polygon points="256,184 272,196 284,232 268,262 256,278 244,262 228,232 240,196"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M 210 152 L 215 168 L 231 173 L 215 178 L 210 194 L 205 178 L 189 173 L 205 168 Z"/>
    <path d="M 309 268 L 312 277 L 321 280 L 312 283 L 309 292 L 306 283 L 297 280 L 306 277 Z" fill-opacity="0.9"/>
    <path d="M 262 342 L 264 349 L 271 351 L 264 353 L 262 360 L 260 353 L 253 351 L 260 349 Z" fill-opacity="0.8"/>
  </g>
</svg>
