[package]
name = "world-of-claudecraft"
version = "0.1.0"
description = "World of ClaudeCraft desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# This is a thin webview shell (opens a window to the live site), so runtime perf
# is irrelevant. Low optimization keeps peak compiler memory small — opt-level=3
# can OOM rustc-LLVM during final codegen on modest machines.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
incremental = false
