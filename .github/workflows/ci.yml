name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev-*'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull_request runs for the same PR. Group by event name plus
# PR number (or ref for pushes) so release/** pushes and other events stay
# isolated from ordinary PR traffic and cannot cancel each other (D4).
# cancel-in-progress is true for every event in this group; release isolation
# comes from the event_name segment, not from disabling cancel on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Two-tier i18n gate, split by git ref in this one file. Each tier is a parallel
# pair (tests job + checks job, no needs edge either way) so wall clock is
# max(tests, checks), not their sum. Locally `npm run gate` (scripts/gate.mjs)
# still runs the combined step list serially with ONE full unsharded vitest.
#
#   pr-gate       cheap, English-only-legal TEST job. Runs on pull requests, on
#                 pushes to non-release branches (main, dev-*), and on manual
#                 dispatch. It runs `npm test` WITHOUT I18N_RELEASE_TIER, so the
#                 release-only checks (s3_localized, copied-English rendered
#                 content, 21-locale key parity, empty-`pending`) are skipped.
#                 What it still enforces: registry-in-sync, s3_registered (every
#                 emit maps to a registered key/RULE), and placeholder parity for
#                 the translations that actually exist. An English-only PR
#                 (sparse overlay) passes here. The suite is an 8-shard matrix
#                 (each shard executes a partition of the test files), so the
#                 job's wall time is the slowest shard, not the whole suite.
#
#   pr-checks     the PR tier's serialized checks (i18n freshness + coverage
#                 summary, malware gate, game/admin typecheck, env/server/bot/client
#                 builds), parallel with pr-gate. Same triggers as pr-gate.
#
#   release-gate  full TEST job for a release ref. Runs on release/** pushes and on
#                 the release-to-main PR merge result. Runs at PR tier (no
#                 I18N_RELEASE_TIER), same 8-shard matrix as pr-gate, tests only
#                 (no builds), so a red shard here always means a real regression.
#
#   release-i18n  the release TIER, alone: the suites that read
#                 I18N_RELEASE_TIER, run under it, unsharded. A merely `pending`
#                 (untranslated) key cannot survive this job. Expected red until
#                 the release-time locale fill, which is exactly why it is its own
#                 job: on release-gate it used to mask genuine failures (#2820).
#
#   release-checks the release tier's serialized checks (same step list as
#                 pr-checks), parallel with release-gate. Same triggers as
#                 release-gate. Does not set I18N_RELEASE_TIER (freshness,
#                 malware, typecheck, and builds do not need it; release-i18n
#                 alone carries the tier flag).
#
# The release tier is a superset: release-gate runs every PR-tier check and
# release-i18n adds the release-only assertions on top; typecheck and the four
# builds live in release-checks.
#
# Path filters (D10): a cheap `changes` job classifies pull_request diffs as
# code vs docs-only. Docs/markdown/screenshot-only PRs keep lint (and any other
# always-on cheap jobs) but skip pr-gate, pr-checks, and browser-gate. Any touch
# of the code path set forces the full PR tier. push to main/dev-* and
# workflow_dispatch always report code=true (full PR tier when unsure).
# Release/** pushes and release-to-main PRs never consult the filter:
# release-gate, release-checks, and release-version-gate stay always-full
# (no path skip on those jobs).
#
# Selective PR tier (the CI/CD performance packet's Phase 2): the same
# changes job also emits test_mode/changed_files from the same listing, and the
# pr-gate shards run scripts/ci_shard_test.mjs, which either replays the full
# `npm test -- --shard` step (mode=full, the fail-closed default for anything
# unprovable) or runs the always-run floor + `vitest related`, sharded. The
# reference semantics and the audit contract live in docs/qa-gate.md
# ("Selective PR-tier CI"). Selection NEVER applies to release-gate or the
# nightly workflow: those are the unconditional full-suite backstops.

jobs:
  release-version-gate:
    name: Release version gate
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version surfaces
        run: npm run release:check

  # Classify whether this run touches the code path set (D10). The classifier
  # reads the PR's changed files from the GitHub API (the pull request files
  # endpoint, paginated) instead of a checkout + git diff: the old full-history
  # checkout of this binary-heavy repo cost about 10 serial minutes on every PR
  # before any test could start, and twice wedged for 90+ minutes with no
  # timeout to kill it. Default code=true (fail closed toward the full suite):
  # any API error, pagination overflow, payload mismatch, or non-PR event
  # yields code=true; only a provably docs-only PR sets code=false. The rules
  # and the fail-closed decision live in scripts/lib/ci_change_classify.mjs
  # (unit-tested by tests/ci_change_classify.test.ts). Release jobs never need
  # this job and never read its output.
  changes:
    name: Detect code path changes
    runs-on: ubuntu-latest
    # Every PR-tier job waits on this one, so a wedged runner must fail fast
    # and be retried, never hang for an hour and a half.
    timeout-minutes: 5
    # Job-scoped read-only widen: once workflow-level permissions are declared,
    # unlisted scopes are none, and the PR files endpoint needs
    # pull-requests: read. Nothing here may ever be a write scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # Phase 2 selection decision (docs/qa-gate.md, "Selective PR-tier CI"): the
      # same fetched listing also decides whether pr-gate may run the selective
      # test plan. Fail closed: anything unprovable is test_mode=full, and full
      # mode is byte-identical to the pre-selection shard step. Release jobs
      # never read these.
      test_mode: ${{ steps.filter.outputs.test_mode }}
      test_mode_reason: ${{ steps.filter.outputs.test_mode_reason }}
      changed_files: ${{ steps.filter.outputs.changed_files }}
    steps:
      - name: Check out classifier script
        uses: actions/checkout@v6
        with:
          # Blob-less shallow sparse checkout: this job needs only the
          # classifier script, never the tree or the history.
          filter: blob:none
          sparse-checkout: |
            scripts

      - name: Classify changed paths
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The classifier is stdlib-only (global fetch), so it runs on the
        # runner's preinstalled Node: no setup-node, no dependency install on
        # this serial critical path.
        run: node scripts/detect_code_changes.mjs

  # Biome formatter + linter, adopted as a forward ratchet: only files actually
  # changed by this push/PR are checked (`--changed`), so the large existing tree
  # is never retroactively reformatted, while every new diff must pass format+lint.
  # `--no-errors-on-unmatched` keeps the job green when a change touches no
  # Biome-eligible file (docs, assets, generated i18n).
  lint:
    name: Format + lint (Biome, changed files)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # Default shallow checkout. Biome --changed --since only needs the base
        # commit object, which the next step fetches with --depth=1 when missing.
        # Full-history checkout was pure waste: it dominated the job wall time.
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zeros='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zeros" ]; then
            # Shallow checkout is tip-only; fetch the pre-push tip alone.
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            # New branch / missing before SHA: compare against default branch tip.
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
            echo "ref=origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Biome check (changed files only)
        env:
          BASE_REF_RESOLVED: ${{ steps.base.outputs.ref }}
        run: npx @biomejs/biome ci --changed --since="$BASE_REF_RESOLVED" --no-errors-on-unmatched

  browser-gate:
    name: Browser regressions (Chromium)
    # Skip on confirmed docs-only PRs (no browser tests/code touched). Non-PR
    # and code PRs keep the job (changes.code defaults true off PR events).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version for cache key
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium browsers
        # Restores ~/.cache/ms-playwright when the Playwright version matches.
        # The install step always runs: on a hit it is a cheap no-op for the
        # browser download and only ensures OS deps; on a miss it downloads.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

  # The PR tier is two parallel jobs: pr-gate runs the test suite while pr-checks
  # runs the serialized checks, so the PR critical path is max(tests, checks)
  # instead of their sum. pr-gate additionally fans the suite across an 8-shard
  # matrix (vitest --shard=i/8: sha1-contiguous file packs). D11 path-matrix
  # follow-on tried LPT and stripe sequencers (scripts/ci_balanced_sequencer.mjs);
  # both missed D11 and are unwired. Wall time is the slowest shard. Locally
  # `npm run gate` (scripts/gate.mjs) runs the SAME combined step list serially
  # with ONE full unsharded vitest run by design (bounded workers); keep that
  # script's step list in sync when adding or removing a step in either job.
  pr-gate:
    name: PR gate (English-only legal)
    # Compose release-to-main exclusion with the code path filter (D10). Do not
    # drop either arm: release-to-main must still select release-*, and docs-only
    # PRs must skip this matrix. needs.changes only; no needs edge to pr-checks.
    needs: changes
    if: ((github.event_name == 'pull_request' && (github.base_ref != 'main' || !startsWith(github.head_ref, 'release/'))) || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')) || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    # fail-fast stays off: shards pass or fail independently, so one red shard
    # never cancels the others and a failure report always covers the whole
    # suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shard runner spawns `npm test` itself, so pretest still regenerates
      # the i18n artifacts in EVERY shard BY DESIGN (the S3 guard, guide
      # freshness, and the git-subprocess suites need the generated artifacts no
      # matter which shard they hash into); the freshness diff lives in
      # pr-checks. Workers stay at half the runner's cores inside the script.
      #
      # Phase 2 (docs/qa-gate.md, "Selective PR-tier CI"): the runner reads the
      # changes job's selection decision. test_mode=full spawns exactly the old
      # step (`npm test -- --shard=i/8`); test_mode=selective runs the
      # always-run floor (blind/partial tests + invariant guard suites + changed
      # tests, recomputed in this tree) plus `vitest related` over the changed
      # sources, both sharded. Decisions and skip counts print in the job log.
      # Release-gate below keeps the unconditional full run line; the nightly
      # workflow re-proves the full suite daily (docs/qa-gate.md).
      - name: Run tests (PR tier, shard ${{ matrix.shard }} of 8)
        env:
          TEST_MODE: ${{ needs.changes.outputs.test_mode }}
          TEST_MODE_REASON: ${{ needs.changes.outputs.test_mode_reason }}
          CHANGED_FILES: ${{ needs.changes.outputs.changed_files }}
        run: node scripts/ci_shard_test.mjs --shard=${{ matrix.shard }}/8

  # Runs in parallel with pr-gate: same if-condition, no needs edge in either
  # direction. The default pull_request merge-ref checkout MUST be preserved
  # here: the freshness diff checks the MERGE RESULT against the base branch,
  # not just the PR head.
  pr-checks:
    name: PR checks (freshness, typecheck, builds)
    # Same composition as pr-gate: release exclusion + code path filter. Skipped
    # entirely on docs-only PRs (malware/typecheck/builds are code-path gates).
    needs: changes
    if: ((github.event_name == 'pull_request' && (github.base_ref != 'main' || !startsWith(github.head_ref, 'release/'))) || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')) || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate i18n artifacts
        run: npm run i18n:gen

      # Post the coverage counts of the gitignored i18n.status.summary.json (written
      # by the i18n:gen step above) to the job summary as the out-of-band audit trail.
      - name: Post i18n coverage summary
        run: node scripts/i18n_coverage_summary.mjs

      # Fast, legible fail BEFORE the long build steps if a committed generated
      # artifact drifted from source (someone changed an overlay or a catalog key but
      # forgot to regenerate). The status registry and its counts summary are both
      # gitignored; the diff covers the committed line-item locale slices AND the
      # generated TranslationKey union. The test suite also enforces this, this just
      # surfaces it sooner.
      - name: Verify committed i18n artifacts are fresh
        run: git diff --exit-code -- src/ui/i18n.resolved.generated src/admin/i18n.resolved.generated src/ui/i18n.catalog/translation_keys.generated.ts

      # Release-gate malicious-code scan. The flagger is high-recall (most hits are
      # expected dev-tooling false positives), so this uses --gate: it fails only on
      # a HIGH-severity signature that survives the path-aware priors (a wallet
      # drainer, a hardcoded-credential auth bypass, an exfil channel, a planted
      # instruction-file injection). tests/malware_scan.test.ts asserts the same
      # inside `npm test`; this just surfaces it sooner and more legibly.
      - name: Malicious-code gate
        run: npm run security:gate

      # tsc's own incremental cache (node_modules/.cache/tsc/buildinfo.json, via
      # check:ts's --incremental flag). Keyed on the lockfile and tsconfig so a
      # dependency or compiler-option change starts clean; tsc still verifies
      # every file's content hash against the cache, so a stale restore only
      # saves the unchanged-file re-check, never hides a real type error.
      - name: Cache tsc incremental buildinfo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: tsc-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-

      - name: Typecheck
        run: npm run check:types

      - name: Build headless environment
        run: npm run build:env

      - name: Build server
        run: npm run build:server

      # The Discord bot bundles from the same tree and ships in the same image
      # (Dockerfile runs build:bot), so a broken bot bundle must fail here rather
      # than on the production host during docker compose up --build.
      - name: Build Discord bot
        run: npm run build:bot

      - name: Build client
        run: npm run build

  # A release ref runs THREE parallel jobs: release-gate (this one) runs the test
  # suite at PR tier, release-i18n runs the release TIER over the suites that read
  # the flag, and release-checks runs the serialized checks, so the release critical
  # path is max(tests, tier, checks) instead of tests-then-builds on shard 1.
  # Locally `npm run gate` (scripts/gate.mjs) still runs the SAME combined step
  # list serially with ONE full unsharded vitest by design, plus the same dedicated
  # release-tier step; keep that script's step list in sync when adding or removing
  # a step in any of the three jobs.
  release-gate:
    # NOT "21-locale": since #2820 the 21-locale assertions live in release-i18n, and
    # the label is what an operator reads in the checks list to tell the two reds apart.
    name: Release gate (tests)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    # No I18N_RELEASE_TIER here BY DESIGN (D8 revised, issue #2820). This job runs
    # the suite at PR tier so a red shard always means a real regression. The
    # release tier lives in the release-i18n job below, over the tier-sensitive
    # suites only, so "the locale fill has not run yet" can never mask a broken
    # test the way it did when one job carried both signals.

    # Same 8-shard matrix as pr-gate. fail-fast stays off so shards report
    # independently. Serialized checks live in release-checks, not here.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm test` regenerates the i18n artifacts itself (pretest) in EVERY
      # shard BY DESIGN (the S3 guard, guide freshness, and the git-subprocess
      # suites need the generated artifacts no matter which shard the balanced
      # sequencer assigns them to), so this job needs no explicit i18n:gen step;
      # the freshness diff lives in release-checks.
      # Full Sim suites are CPU-heavy. Keep each shard at half the runner's
      # available cores, matching the bounded local gate.
      - name: Run tests (PR tier, shard ${{ matrix.shard }} of 8)
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers="$(node -p 'Math.max(1, Math.floor(require("node:os").availableParallelism() / 2))')"

  # The release tier, alone (issue #2820). Only the suites whose assertions change
  # under the flag run here, so this job answers exactly one question: has the
  # 21-locale fill been done? It is EXPECTED to be red for most of a cycle, and that
  # is the point: it is red on its own name, next to a release-gate that stays green
  # unless code is genuinely broken. Unsharded and seconds long (five files), so it
  # costs a runner slot, not runner minutes. The file list is pinned three ways
  # (this command, I18N_RELEASE_TIER_SUITES in scripts/lib/gate_steps.mjs, and a scan
  # of tests/ for readers of the flag) by tests/release_i18n_tier_coverage.test.ts,
  # so a new tier-sensitive suite cannot silently stop running under the tier.
  release-i18n:
    name: Release i18n (21-locale fill)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    env:
      I18N_RELEASE_TIER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `npm test` regenerates the i18n artifacts itself (pretest), which these
      # suites read.
      - name: Run i18n release-tier suites (21-locale + empty-pending)
        run: npm test -- tests/deed_i18n.test.ts tests/i18n_status_registry.test.ts tests/i18n_t_behavior.test.ts tests/localization_coverage.test.ts tests/localization_fixes.test.ts

  # Runs in parallel with release-gate: same if-condition, no needs edge in
  # either direction. Does not set I18N_RELEASE_TIER; the checks here do not
  # depend on it, and the release-i18n job alone owns the tier flag.
  release-checks:
    name: Release checks (freshness, typecheck, builds)
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate i18n artifacts
        run: npm run i18n:gen

      # Post the coverage counts of the gitignored i18n.status.summary.json (written
      # by the i18n:gen step above) to the job summary as the out-of-band audit trail.
      - name: Post i18n coverage summary
        run: node scripts/i18n_coverage_summary.mjs

      # Fast, legible fail BEFORE the long build steps if a committed generated
      # artifact drifted from source (someone changed an overlay or a catalog key but
      # forgot to regenerate). The status registry and its counts summary are both
      # gitignored; the diff covers the committed line-item locale slices AND the
      # generated TranslationKey union. The test suite also enforces this, this just
      # surfaces it sooner.
      - name: Verify committed i18n artifacts are fresh
        run: git diff --exit-code -- src/ui/i18n.resolved.generated src/admin/i18n.resolved.generated src/ui/i18n.catalog/translation_keys.generated.ts

      # Release-tier malicious-code scan (see pr-checks for the rationale).
      # --gate fails only on a HIGH-severity signature surviving the path-aware
      # priors; the full agent-judged pass is the `release-malware-audit` skill.
      - name: Malicious-code gate
        run: npm run security:gate

      # Same tsc incremental cache as pr-checks (#2758). release-checks is not
      # matrixed, so no matrix.shard gate (Phase 4: checks run once, not on
      # release-gate shard 1).
      - name: Cache tsc incremental buildinfo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: tsc-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-buildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-

      - name: Typecheck
        run: npm run check:types

      - name: Build headless environment
        run: npm run build:env

      - name: Build server
        run: npm run build:server

      # Same reason as the PR-tier job: the bot bundles from this tree and ships
      # in the same image, so a broken bot bundle fails here, not on the host.
      - name: Build Discord bot
        run: npm run build:bot

      - name: Build client
        run: npm run build
