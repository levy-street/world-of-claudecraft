[package]
name = "woc-auction-escrow"
version = "0.1.0"
description = "Non-custodial $WOC English-auction escrow for one SPL token: atomic outbid refund, constant-capped burn rake, settler routing, and a permissionless reclaim liveness valve"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "woc_auction_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
